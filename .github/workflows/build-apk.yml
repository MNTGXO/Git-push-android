name: Build APK

# The one workflow to grab an installable APK.
#  • every push  → artifact "gitpulse-apk" (debug, always installable)
#  • default branch → also refreshes the rolling "latest" prerelease so anyone can
#    download the newest build from the Releases page without a GitHub login.
on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'ci-logs/**'
      - 'design/screens/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this build as a prerelease'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble & publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name artefacts
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          STAMP=$(date -u +%Y%m%d-%H%M)
          NAME="GitPulse-${STAMP}-${GITHUB_SHA::7}.apk"
          cp "$SRC" "dist/$NAME"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitpulse-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 60

      - name: Publish rolling prerelease
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=apk-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --title "GitPulse · latest build" \
            --prerelease \
            --notes "Automatic build from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`.
          Download the .apk below and install it (allow installs from this source)."

      - name: What to install
        run: |
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "dist/$APK_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact **gitpulse-apk** is attached to this run." >> "$GITHUB_STEP_SUMMARY"
