name: Build APK

# The one workflow to grab an installable APK.
#  • every push  → artifact "gitpulse-apk" (release build, always installable)
#  • published refs → refreshes the rolling "apk-latest" prerelease, which the app's own
#    updater reads, so users update with one tap.
#
# Why a *release* build, not debug: the app must always be signed with the same key or Android
# refuses the update ("package conflict" / "app not installed"). The key is derived from a seed
# in tools/release-key, so it is identical on every runner and every checkout. Debug APKs would
# also install to a different package id (com.mntx.gitpulse.debug).
on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'ci-logs/**'
      - 'design/screens/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this build as a prerelease'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble & publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Deterministic signing material — identical bytes on every runner.
      - name: Generate release keystore
        run: |
          set -euo pipefail
          python3 tools/release-key/make_keystore.py
          # Put it outside the repo so `git status` stays clean, and point Gradle at it.
          mkdir -p "$RUNNER_TEMP/signing"
          mv tools/release-key/release.p12 tools/release-key/release.keystore tools/release-key/keystore.properties "$RUNNER_TEMP/signing/" 2>/dev/null || true
          sed -i "s#^storeFile=.*#storeFile=$RUNNER_TEMP/signing/release.keystore#" "$RUNNER_TEMP/signing/keystore.properties"
          cp "$RUNNER_TEMP/signing/keystore.properties" keystore.properties
          cat keystore.properties

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name artefacts
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          STAMP=$(date -u +%Y%m%d-%H%M)
          NAME="GitPulse-${STAMP}-${GITHUB_SHA::7}.apk"
          cp "$SRC" "dist/$NAME"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          # Prove the signing identity so a future runner can be compared against this line.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "dist/$NAME" | head -n3 | tee -a "$GITHUB_STEP_SUMMARY"

      # A minified release build can fail only at runtime. This at least proves R8 kept the
      # entry points and the serializers the whole data layer depends on.
      - name: Smoke-test the minified APK
        run: |
          set -euo pipefail
          APK=$(ls dist/*.apk | head -n1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -E "^package:|launchable-activity:" | tee -a "$GITHUB_STEP_SUMMARY"
          # R8 must have kept the launcher: without it the app installs and crashes instantly.
          echo "$BADGING" | grep -q "launchable-activity: name='com.mntx.gitpulse.MainActivity'" \
            || { echo "FAIL: launcher activity missing from the APK"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex" || { echo "FAIL: no dex in APK"; exit 1; }
          echo "smoke test passed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitpulse-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 60

      - name: Publish rolling prerelease
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=apk-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --title "GitPulse · latest build" \
            --prerelease \
            --notes "Automatic build from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`.
          Download the .apk below and install it (allow installs from this source)."

      - name: What to install
        run: |
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "dist/$APK_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact **gitpulse-apk** is attached to this run." >> "$GITHUB_STEP_SUMMARY"
