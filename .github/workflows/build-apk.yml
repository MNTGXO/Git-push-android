name: Android CI — Build APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which variants to build'
        required: true
        default: 'both'
        type: choice
        options: [ debug, release, both ]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee ci-logs/test.log || true

      - name: Build APKs
        id: assemble
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease 2>&1 | tee ci-logs/output.log

      - name: Rename artefacts
        if: success()
        run: |
          mkdir -p ci-logs/apk
          cp app/build/outputs/apk/debug/app-debug.apk "ci-logs/apk/gitpulse-debug.apk" 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk "ci-logs/apk/gitpulse-release.apk" 2>/dev/null || true
          ls -la ci-logs/apk || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gitpulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gitpulse-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish build log to branch
        if: always() && github.event_name == 'push' && github.ref_type == 'branch'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-logs
          if [ ! -f ci-logs/output.log ]; then
            echo "assemble step did not start (job status: $JOB_STATUS)" > ci-logs/output.log
          fi
          tail -n 1200 ci-logs/output.log > ci-logs/output.log.tmp && mv ci-logs/output.log.tmp ci-logs/output.log || true
          printf 'run_id=%s\njob_status=%s\n' "${{ github.run_id }}" "$JOB_STATUS" > ci-logs/status.txt
          git config user.name "gitpulse-ci"
          git config user.email "ci@gitpulse.local"
          git add -f ci-logs/output.log ci-logs/status.txt ci-logs/test.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no log changes"
          else
            git commit -m "ci: build log [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "log push failed"
          fi

  screenshots:
    name: Render UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots (Roborazzi)
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon recordRoborazziDebug 2>&1 | tee ci-logs/screenshot.log || true
          mkdir -p ci-logs/screens
          find app/src/test -name "*.png" -exec cp {} ci-logs/screens/ \; 2>/dev/null || true
          find app/build -name "*.png" -path "*roborazzi*" -exec cp {} ci-logs/screens/ \; 2>/dev/null || true
          ls -la ci-logs/screens || true

      - name: Publish screenshots to branch
        if: always() && github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          mkdir -p ci-logs
          printf 'run_id=%s\n' "${{ github.run_id }}" > ci-logs/screenshot-status.txt
          git config user.name "gitpulse-ci"
          git config user.email "ci@gitpulse.local"
          git add -f ci-logs/screens ci-logs/screenshot.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no screenshot changes"
          else
            git commit -m "ci: screenshots [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "screenshot push failed"
          fi

  release:
    name: Attach APK to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artefacts/**/*.apk
          fail_on_unmatched_files: false
