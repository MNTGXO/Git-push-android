name: Release

# Tag-driven, signed-if-possible release. Works with zero secrets: without a keystore the
# APK is signed with the debug key so it is still installable.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Feature branches are read-only by default, so they restored caches and never saved
          # them ("Entry not saved: cache is read-only"). Let this branch warm its own cache.
          cache-read-only: false
          # `transforms` is the artifact-transform output: ~213 MB per dependency-graph hash, and a
          # new hash on nearly every change to build files. That churn filled 6.5 GiB of the 10 GiB
          # repo budget with seven near-identical copies from one afternoon, which is what makes
          # later saves fail with "entry not saved". It is the cheapest cache to rebuild, so drop
          # it and keep the parts that actually cost minutes (dependencies, wrapper, jars).
          gradle-home-cache-excludes: |
            caches/transforms-*
            caches/modules-2/files-2.1/*/*/*/*-sources.jar

      # `if: secrets.X` is invalid workflow syntax and made the whole workflow unloadable.
      # Decoding inside a step keeps it optional and valid.
      - name: Configure optional signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Signing with the supplied keystore."
          else
            echo "No keystore secret — the release APK will be debug-signed and installable."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect artefacts
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${{ inputs.tag || github.ref_name }}"
          cp app/build/outputs/apk/release/*.apk "dist/GitPulse-${TAG}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --title "GitPulse $TAG" --generate-notes
          fi
