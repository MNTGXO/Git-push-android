name: Screenshots

# Renders the real Compose screens headlessly and publishes them to the `ui-preview` release,
# so design changes are reviewable on a phone (or a phone-shaped browser tab).
on:
  push:
    branches: [ '**' ]
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render screens
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Compose text rendering under Robolectric needs real system fonts.
      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fontconfig

      - name: Render
        run: |
          set -o pipefail
          mkdir -p design/screens
          ./gradlew --no-daemon testDebugUnitTest --tests "com.mntx.gitpulse.UiSnapshotTest" 2>&1 | tee shots.log

      - name: Collect
        if: always()
        run: |
          mkdir -p design/screens
          find app/build -name '*.png' -path '*screenshots*' -exec cp {} design/screens/ \; || true
          ls -la design/screens || true
          # Fail loudly rather than silently publishing an empty preview.
          COUNT=$(find design/screens -name '*.png' | wc -l)
          echo "rendered $COUNT screenshot(s)"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No screenshots were rendered. See the job log for capture errors."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screens
          path: |
            design/screens/*.png
            shots.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to release
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd design/screens
          zip -qr ui-preview.zip .
          gh release view ui-preview >/dev/null 2>&1 || \
            gh release create ui-preview --prerelease --title "UI preview" --notes "Automatically rendered screens."
          gh release upload ui-preview ui-preview.zip --clobber
