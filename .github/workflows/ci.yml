name: CI

# Tests + headless UI render.
#
# Diagnostics (logs, screenshots, JUnit XML) are uploaded as the `ui-screens-and-reports`
# artefact. They are deliberately NOT committed back to the branch: generated reports carry
# timestamps and hostnames, so any two branches that ran CI conflict in every report file —
# which blocks every PR. Read them from the artefact, the ui-preview release, or the run log.
on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & render
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Feature branches are read-only by default, so they restored caches and never saved
          # them ("Entry not saved: cache is read-only"). Let branch runs warm their own cache;
          # PR merge refs cannot read a feature-branch cache, so they stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Robolectric downloads its android-all jar from Maven Central on first use, inside the test
      # JVM. When that download is rate-limited the whole suite fails with an AssertionError out of
      # MavenArtifactFetcher, which is a harness flake, not a product bug. Cache the jars and warm
      # them explicitly so a flaky CDN degrades to a retry instead of a red build.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      # Optimisation only: if the artifact is slow or unreachable, fall through and let the test JVM
      # attempt its own download rather than blocking the job on a 337 MB transfer.
      - name: Warm Robolectric runtime jars
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -uo pipefail
          JAR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/13-robolectric-9030017-i7/android-all-instrumented-13-robolectric-9030017-i7.jar"
          if [ -s "$JAR" ]; then
            echo "already cached: $(stat -c%s "$JAR") bytes"
            exit 0
          fi
          mkdir -p "$(dirname "$JAR")"
          URL="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/13-robolectric-9030017-i7/android-all-instrumented-13-robolectric-9030017-i7.jar"
          for attempt in 1 2; do
            echo "attempt $attempt"
            if curl -fsSL --retry 2 --retry-delay 3 --connect-timeout 15 --max-time 150 \
                 -o "$JAR.part" "$URL"; then
              mv "$JAR.part" "$JAR"
              echo "downloaded $(stat -c%s "$JAR") bytes"
              exit 0
            fi
            rm -f "$JAR.part"
            sleep 5
          done
          echo "::notice::pre-fetch skipped; the test JVM will fetch the jar itself"

      # Compose text rendering under Robolectric needs real system fonts.
      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fontconfig

      - name: Test & render screens
        id: test
        run: |
          mkdir -p ci-logs/screens ci-logs/reports
          set +e
          # Probe first: it isolates harness failures from product-screen failures.
          ./gradlew --no-daemon testDebugUnitTest --tests "com.mntx.gitpulse.RenderProbeTest" 2>&1 | tee ci-logs/probe.log
          ./gradlew --no-daemon testDebugUnitTest --continue 2>&1 | tee ci-logs/test.log
          STATUS=${PIPESTATUS[0]}
          # Robolectric resolves android-all lazily inside the test JVM, so a Maven Central hiccup
          # surfaces as ~every screen test failing at MavenArtifactFetcher. Retry once for that
          # signature only, so genuine failures still fail the build.
          if [ "$STATUS" -ne 0 ] && grep -qE "MavenArtifactFetcher|Failed to fetch maven artifact" ci-logs/test.log; then
            echo "::warning::Robolectric artifact fetch failed; retrying the suite once"
            sleep 20
            ./gradlew --no-daemon testDebugUnitTest --continue 2>&1 | tee ci-logs/test.log
            STATUS=${PIPESTATUS[0]}
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect artefacts
        if: always()
        run: |
          find app/build \( -name '*.png' -path '*screenshots*' \) -exec cp {} ci-logs/screens/ \; 2>/dev/null || true
          cp -r app/build/reports/tests/testDebugUnitTest ci-logs/reports/html 2>/dev/null || true
          cp -r app/build/test-results/testDebugUnitTest ci-logs/reports/xml 2>/dev/null || true
          rm -rf ci-logs/reports/xml/binary 2>/dev/null || true
          # Keep the published tree small and text-only where possible.
          head -c 400000 ci-logs/test.log > ci-logs/test.log.tmp 2>/dev/null || true
          [ -f ci-logs/test.log.tmp ] && mv ci-logs/test.log.tmp ci-logs/test.log
          echo "screens: $(find ci-logs/screens -name '*.png' | wc -l)"
          grep -iE "capture .* (failed|->)|probe bitmap|tests completed|BUILD (SUCCESSFUL|FAILED)" ci-logs/test.log ci-logs/probe.log | tail -40 > ci-logs/summary.txt || true
          cat ci-logs/summary.txt || true

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screens-and-reports
          path: |
            ci-logs/screens/
            ci-logs/test.log
            ci-logs/probe.log
            ci-logs/reports/
          if-no-files-found: warn
          retention-days: 30

      # Publishes to the release instead of the branch, so open PRs never collide on artefacts.
      - name: Publish screenshot bundle
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd ci-logs/screens
          ls *.png >/dev/null 2>&1 || { echo "no screenshots to publish"; exit 0; }
          zip -qr ui-preview.zip .
          gh release view ui-preview >/dev/null 2>&1 || \
            gh release create ui-preview --prerelease --title "UI preview" --notes "Automatically rendered screens."
          gh release upload ui-preview ui-preview.zip --clobber

      # Per-branch preview: the default branch keeps the rolling `ui-preview` release, but any
      # other ref publishes to a ref-specific tag so a PR's screens can be reviewed as images
      # without committing them (which is what used to conflict).
      # Logs are otherwise only visible inside the run UI. Posting the failure text to the open
      # PR keeps it readable from anywhere (API/gh), which matters when a build has to be debugged
      # without a browser.
      - name: Report failures on the pull request
        if: always() && steps.test.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          PR=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')
          [ -z "$PR" ] && { echo "no open PR for ${GITHUB_REF_NAME}; skipping"; exit 0; }
          {
            echo "### CI failed on \`${GITHUB_SHA::7}\`"
            echo
            echo '```'
            grep -E "e: file|FAILED|tests completed|BUILD (SUCCESSFUL|FAILED)|AssertionError|Exception" \
              ci-logs/test.log ci-logs/probe.log 2>/dev/null | head -60 || echo "(no matching lines)"
            echo '```'
            echo
            echo "<details><summary>tail of test.log</summary>"
            echo
            echo '```'
            tail -c 6000 ci-logs/test.log 2>/dev/null || true
            echo '```'
            echo "</details>"
          } > /tmp/ci-report.md
          gh pr comment "$PR" --body-file /tmp/ci-report.md || echo "comment failed"

      # PRs from a fork get a read-only token; the run must still pass when only reporting fails.
      - name: Report failures (tolerate read-only tokens)
        if: always() && steps.test.outputs.status != '0'
        run: echo "reporting is best-effort; failure text also lives in the run log"

      - name: Publish branch UI preview
        if: always() && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd ci-logs/screens 2>/dev/null || { echo "no screenshots directory"; exit 0; }
          ls *.png >/dev/null 2>&1 || { echo "no screenshots to publish"; exit 0; }
          zip -qr ui-preview.zip .
          REF="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] && REF="tag-${REF}"
          TAG="ui-preview-${REF//\//-}"
          echo "publishing $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "UI preview · ${REF}" \
              --notes "Automatically rendered screens for ${REF}." || true
          gh release upload "$TAG" ui-preview.zip --clobber

      - name: Enforce test result
        if: always()
        run: |
          echo "unit test exit status: ${{ steps.test.outputs.status }}"
          exit "${{ steps.test.outputs.status }}"
