name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile & APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon testDebugUnitTest --continue 2>&1 | tee ci-logs/test.log || true
      - name: Assemble
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon assembleDebug 2>&1 | tee ci-logs/output.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gitpulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish build log
        if: always()
        run: |
          mkdir -p ci-logs
          [ -f ci-logs/output.log ] || echo "assemble did not run" > ci-logs/output.log
          tail -n 1500 ci-logs/output.log > ci-logs/tmp && mv ci-logs/tmp ci-logs/output.log
          git config user.name "gitpulse-ci"
          git config user.email "ci@gitpulse.local"
          # Only publish when this run is building the true branch tip, otherwise we race
          # newer commits and end up with stale artefacts.
          REMOTE_SHA=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$REMOTE_SHA" != "${GITHUB_SHA}" ]; then
            echo "skipping log publish: run is for ${GITHUB_SHA}, branch tip is ${REMOTE_SHA}"
            exit 0
          fi
          git add -f ci-logs/output.log ci-logs/test.log 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "ci: log [skip ci]"; git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true; git push origin "HEAD:${GITHUB_REF_NAME}" || true; }

  screenshots:
    name: Render UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fontconfig
      - name: Render
        run: |
          set -o pipefail
          mkdir -p ci-logs/screens ci-logs/reports
          set +e
          ./gradlew --no-daemon testDebugUnitTest --tests "com.mntx.gitpulse.UiSnapshotTest" 2>&1 | tee ci-logs/screenshot.log
          set -e
          echo "--- searching for PNGs ---"
          find . -name "*.png" -not -path "./.git/*" | head -40 > ci-logs/reports/pngs.txt || true
          cat ci-logs/reports/pngs.txt
          find . -name "*.png" -not -path "./.git/*" -path "*screenshot*" -exec cp {} ci-logs/screens/ \; 2>/dev/null || true
          cp -r app/build/test-results/testDebugUnitTest ci-logs/reports/xml 2>/dev/null || true
          cp -r app/build/reports/tests/testDebugUnitTest ci-logs/reports/html 2>/dev/null || true
          find ci-logs/reports/xml -name "*.xml" -exec sed -n '1,200p' {} \; > ci-logs/reports/xml.txt 2>/dev/null || true
          ls -la ci-logs/screens ci-logs/reports
      - name: Publish
        if: always()
        run: |
          REMOTE_SHA=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$REMOTE_SHA" != "${GITHUB_SHA}" ]; then
            echo "skipping render publish: run is for ${GITHUB_SHA}, branch tip is ${REMOTE_SHA}"
            exit 0
          fi
          git config user.name "gitpulse-ci"
          git config user.email "ci@gitpulse.local"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add -f ci-logs/screens ci-logs/reports ci-logs/screenshot.log 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "ci: render [skip ci]"; git push origin "HEAD:${GITHUB_REF_NAME}" || true; }
